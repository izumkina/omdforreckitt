<style>html,body{margin:0;height:100%;background:#F6D0DF;font-family:Manrope,'Segoe UI',Arial,sans-serif;overflow:hidden}
svg.scene{width:100vw;height:100vh;display:block}
.brand{font:700 11px Manrope,Arial,sans-serif;fill:#fff;letter-spacing:.2px}
.ttl{font:300 72px Manrope,Arial,sans-serif;fill:#E8418A;letter-spacing:-1.5px}.sub{font:500 22px Manrope,Arial,sans-serif;fill:#3B2E4C}.hint{font:500 16px Manrope,Arial,sans-serif;fill:#8C7A9C}
.pillbg{fill:rgba(255,255,255,.92);transition:fill .25s}.pilltx{font:700 13.5px Manrope,Arial,sans-serif;fill:#3B2E4C;transition:fill .25s}
.pillar{font:700 13px Manrope,Arial,sans-serif;fill:#fff;opacity:0;transition:opacity .25s}.pilldot{transition:fill .25s}
.hl{fill:#E8418A;opacity:0;transition:opacity .3s}
.room{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
.room.on{cursor:pointer}.room.on:hover .hl,.room.on:focus .hl{opacity:.07}
.room.on:hover .pillbg,.room.on:focus .pillbg{fill:#E8418A}.room.on:hover .pilltx,.room.on:focus .pilltx{fill:#fff}.room.on:hover .pilldot,.room.on:focus .pilldot{fill:#fff}.room.on:hover .pillar,.room.on:focus .pillar{opacity:1}
.room:focus{outline:none}.room:focus-visible .pillbg{stroke:#3B2E4C;stroke-width:2}
.house{animation:hin 1s cubic-bezier(.2,.8,.2,1) both}@keyframes hin{from{opacity:0;transform:translateY(18px)}to{opacity:1}}
@keyframes in{from{opacity:0}to{opacity:1}}
*{transform-box:fill-box}
.lamp{transform-origin:50% 0;animation:sw 4.5s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.sway{transform-origin:50% 100%;animation:sw2 5s ease-in-out infinite alternate}@keyframes sw2{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.swayv{transform-origin:50% 0;animation:sw 5.5s ease-in-out infinite alternate}.towel{transform-origin:50% 0;animation:sw 3.8s ease-in-out infinite alternate}
.bar{transform-origin:50% 100%;animation:gr 3.2s ease-in-out infinite alternate}.b2,.s2{animation-delay:.6s}.b3,.s3{animation-delay:1.2s}.b4,.s4{animation-delay:1.8s}.s1{animation-duration:2.4s}@keyframes gr{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
.card{transform-origin:50% 0;animation:sw 3s ease-in-out infinite alternate}.c1{animation-delay:.7s}.c2{animation-delay:1.3s}.c3{animation-delay:.3s}.c4{animation-delay:1s}
.drum{transform-origin:50% 50%;animation:rot 4s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.bubbles{animation:bu 2.6s ease-in-out infinite}@keyframes bu{0%{transform:translateY(6px);opacity:.2}50%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
.ring{animation:pl 1.6s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.2}50%{opacity:1}}
.flip{transform-origin:50% 50%;animation:fl 4s ease-in-out infinite}.f2{animation-delay:1s}.f3{animation-delay:2s}.f4{animation-delay:3s}@keyframes fl{0%,80%,100%{transform:scaleX(1)}90%{transform:scaleX(.05)}}
.bob{animation:bo 2.6s ease-in-out infinite}@keyframes bo{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.prog{transform-origin:0 50%;animation:pr 6s linear infinite}@keyframes pr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.steam{animation:st 3s ease-in-out infinite}.steam.s2{animation-delay:1.2s}@keyframes st{0%{opacity:0;transform:translateY(5px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-12px)}}
.scent{stroke-dasharray:11 9;animation:sc 2.4s linear infinite}.sc2{animation-duration:3.1s}@keyframes sc{to{stroke-dashoffset:-40}}
.heat{transform-origin:50% 50%;animation:ht 2.8s ease-in-out infinite}.h2{animation-delay:.7s}.h3{animation-delay:1.4s}.h4{animation-delay:2.1s}@keyframes ht{0%,100%{transform:scale(.75);opacity:.6}50%{transform:scale(1.12);opacity:1}}
.lampd{transform-origin:40% 100%;animation:sw2 4.5s ease-in-out infinite alternate}
.blob{transform-origin:50% 50%;animation:bl 14s ease-in-out infinite alternate}.blob.b2{animation-duration:11s}@keyframes bl{from{transform:scale(1) rotate(0deg)}to{transform:scale(1.05) rotate(3deg)}}
.sun{animation:sn 18s ease-in-out infinite alternate}@keyframes sn{from{transform:translateX(0)}to{transform:translateX(40px)}}
.sunk{animation:sn2 9s ease-in-out infinite alternate}@keyframes sn2{from{transform:translateY(0)}to{transform:translateY(8px)}}
.cloud{animation:cl 26s ease-in-out infinite alternate}@keyframes cl{from{transform:translateX(0)}to{transform:translateX(90px)}}
.smoke circle{animation:sm 4s ease-in-out infinite}.smoke circle:nth-child(2){animation-delay:.8s}.smoke circle:nth-child(3){animation-delay:1.6s}@keyframes sm{0%{transform:translateY(8px);opacity:0}40%{opacity:.7}100%{transform:translateY(-14px);opacity:0}}
.tw{animation:pl 2.2s ease-in-out infinite}.t1{animation-delay:.7s}.t2{animation-delay:1.4s}
.knob{animation:kn 3s ease-in-out infinite alternate}.k2{animation-delay:.8s;animation-duration:2.4s}.k3{animation-delay:1.5s;animation-duration:3.6s}@keyframes kn{from{transform:translateX(0)}to{transform:translateX(30px)}}
.robot{animation:rb 8s ease-in-out infinite alternate}@keyframes rb{from{transform:translateX(0)}to{transform:translateX(130px)}}
.dust{animation:du 8s ease-in-out infinite alternate}@keyframes du{0%,30%{opacity:1}100%{opacity:0}}
.tablet .bar{}
#ov{position:fixed;inset:0;background:rgba(59,46,76,.5);display:none;align-items:center;justify-content:center;z-index:5}
#ov.open{display:flex;animation:ovin .25s ease-out}@keyframes ovin{from{opacity:0}to{opacity:1}}
#box{width:95vw;height:93vh;background:#fff;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#FADFEA}
#bar b{font:700 18px Manrope,Arial,sans-serif;color:#3B2E4C}#x{border:0;background:#E8418A;color:#fff;font:700 20px Manrope,Arial;width:44px;height:44px;border-radius:22px;cursor:pointer}
#x:focus-visible{outline:3px solid #3B2E4C;outline-offset:2px}
#fr{flex:1;border:0;width:100%}

<div id="ov" role="dialog" aria-modal="true" aria-labelledby="tt"><div id="box"><div id="bar"><b id="tt"></b><button id="x" aria-label="Закрыть">×</button></div><iframe id="fr" title="Инструмент"></iframe></div></div>

<script>
const TOOLS={"ecom": {"title": "Аналитика ECOMBOOST", "src": "ecomboost.html"}, "reviews": {"title": "Анализ отзывов", "src": "reviews.html"}, "sov": {"title": "SOV tool", "src": "sov.html"}, "game": {"title": "Игра «Угадай аромат»", "src": "game.html"}, "video": {"title": "ALL-VIDEO Planner", "url": "https://videoplanner-pi.vercel.app/"}, "ai": {"title": "AI-агент ПульсГипотез", "url": "https://izumkina.github.io/hypopulsedomru/"}, "neuro": {"title": "Нейроанализ креативов", "url": "https://app.powerbi.com/view?r=eyJrIjoiYTFkYzNlNjAtOGI4My00ZjhmLWEyNzMtMjEwOTZlYmQwMzZkIiwidCI6ImIzZTlmOGIxLTIzY2MtNGM3NC05Yzc2LTg5N2QzNzI5MzUzZCIsImMiOjl9"}};
const ov=document.getElementById('ov'),fr=document.getElementById('fr'),tt=document.getElementById('tt');let last=null;
const cache={};
async function unpack(k){ if(cache[k]) return cache[k];
  const bin=Uint8Array.from(atob(EMB[k]),c=>c.charCodeAt(0));
  return cache[k]=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }
function close(){ov.classList.remove('open');fr.removeAttribute('src');fr.removeAttribute('srcdoc');if(last)last.focus();}
document.querySelectorAll('.room').forEach(r=>{
  const k=r.dataset.tool,t=TOOLS[k]; if(!t||!(t.src||t.url)) return;
  r.classList.add('on'); r.setAttribute('tabindex','0'); r.setAttribute('role','button'); r.setAttribute('aria-label',t.title);
  const go=async()=>{ if(t.url){window.open(t.url,'_blank','noopener');return;}
    last=r; tt.textContent=t.title; ov.classList.add('open'); document.getElementById('x').focus();
    if(typeof EMB!=='undefined'&&EMB[k]){try{fr.srcdoc=await unpack(k);}catch(e){fr.src=t.src;}} else fr.src=t.src; };
  r.addEventListener('click',go); r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
});
document.getElementById('x').addEventListener('click',close);
ov.addEventListener('click',e=>{if(e.target===ov)close();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('open'))close();});
</script></body></html>
